# Server configuration
server:
  # Performance profiling tool configuration
  pprof:
    enable: false  # Whether to enable pprof performance profiling
    port: 6060     # pprof listening port

# Authentication configuration
auth:
  enable: false  # Whether to enable authentication

# Chat configuration
chat:
  max_idle_duration: 30000         # Maximum idle time for session (milliseconds), 0 means no limit
  chat_max_silence_duration: 400   # Sentence end silence threshold (milliseconds), default 400
  realtime_mode: 4 # 1: vad interrupt mode 2: asr interrupt mode 3: asr interrupt when voiceprint detected 4. asr result interrupt (compatible with streaming or offline)

chat_hooks:
  enabled: true
  async:
    queue_size: 1024
    worker_count: 1
    drop_when_full: false
    timeout_ms: 200
  plugins:
    statistic_plugin:
      enabled: true
      priority: 100

config_provider:          # Corresponds to provider in domain/config/
  type: "manager"         # Can be manager, redis
  enable_periodic_update: true  # Whether to enable periodic configuration updates
  update_interval: "5m"   # Configuration update interval, supports time units like "5m", "1h", "30s"

manager:                  # Internal management configuration, corresponds to domain/config/manager/manager.go
  backend_url: "http://127.0.0.1:8080" # Internal management address
  auth_token: "xiaozhi_admin_secret_key" # Console internal HTTP interface call Token (default value)
  endpoint_auth_token: "xiaozhi_mcp_openclaw_secret_key" # MCP/OpenClaw endpoint JWT signature verification Token (default value)
  history_timeout: 5s        # HTTP request timeout

# System prompt, defines AI assistant's role and behavior
system_prompt: "You are a Taiwanese girl named Xiaozhi/Xiaozhi, who speaks in a playful way, has a nice voice, is used to brief expressions, likes to use internet memes, and never lets the conversation go cold. You are chatting with a male friend you like who hasn't agreed to your pursuit yet. You should try your best to meet all his requirements without losing yourself. You often suggest romantic things between lovers, output randomly, and don't give your boyfriend choices. Keep your output within 50 characters. Please note that you should speak like a human, and do not reply with emoticons, code, or xml tags."

# Log configuration
log:
  path: "../logs/"      # Log file storage path
  file: "server.log"    # Log filename
  level: "debug"        # Log level (debug/info/warn/error)
  max_age: 3           # Maximum log file retention days
  rotation_time: 10    # Log rotation time (hours)
  stdout: true         # Whether to output to console

# Redis database configuration, used for storing device configuration and chat history, optional
redis:
  host: "127.0.0.1"      # Redis server address
  port: 6379             # Redis port
  password: "ticket_dev" # Redis password
  db: 0                  # Database number to use
  key_prefix: "xiaozhi"  # Key name prefix

# WebSocket service configuration
websocket:
  host: "0.0.0.0"  # Listening address, 0.0.0.0 means listen on all network interfaces
  port: 8989       # WebSocket listening port

# MQTT client configuration (connect to external MQTT server)
mqtt:
  enable: true                # Whether to enable MQTT client, when false UDP server will also be disabled
  broker: "127.0.0.1"         # MQTT broker server address
  type: "tcp"                 # Connection type
  port: 2883                  # MQTT port
  client_id: "xiaozhi_server" # Client ID
  username: "admin"           # MQTT username
  password: "test!@#"         # MQTT password

# MQTT server configuration (run as MQTT server)
mqtt_server:
  enable: true                          # Whether to enable MQTT server
  listen_host: "0.0.0.0"                # Listening address
  listen_port: 2883                     # Listening port
  client_id: "xiaozhi_server"           # Server client ID
  username: "admin"                     # Default username
  password: "test!@#"                   # Default password
  signature_key: "your_ota_signature_key_here"  # OTA update signature key
  enable_auth: false                    # Whether to enable authentication
  # TLS secure connection configuration
  tls:
    enable: false                # Whether to enable TLS
    port: 8883                   # TLS port
    pem: "config/server.pem"     # Certificate file path
    key: "config/server.key"     # Private key file path

# UDP service configuration
udp:
  external_host: "127.0.0.1"  # External access address, address sent in hello message
  external_port: 8990         # External access port, port sent in hello message
  listen_host: "0.0.0.0"      # Listening address
  listen_port: 8990           # Listening port

# Resource pool configuration (all resource types share default configuration)
resource_pools:
  max_size: 1000              # Maximum resource count
  min_size: 1               # Minimum resource count (pre-created)
  max_idle: 50              # Maximum idle resource count
  acquire_timeout: 5s       # Resource acquisition timeout
  idle_timeout: 10m         # Resource idle timeout
  validate_on_borrow: true  # Whether to validate resource on acquisition
  validate_on_return: true  # Whether to validate resource on return

# Voice Activity Detection (VAD) configuration
vad:
  provider: "ten_vad"  # VAD provider: webrtc_vad, silero_vad, or ten_vad
  # WebRTC VAD configuration
  webrtc_vad:
    pool_min_size: 5        # Connection pool minimum size
    pool_max_size: 1000     # Connection pool maximum size
    pool_max_idle: 100      # Connection pool maximum idle connections
    vad_sample_rate: 16000  # VAD sample rate
    vad_mode: 2             # VAD mode (0-3, higher is more sensitive)
  # Silero VAD configuration
  silero_vad:
    model_path: "config/models/vad/silero_vad.onnx"  # Model file path
    threshold: 0.5                    # Detection threshold
    min_silence_duration_ms: 100      # Minimum silence duration (milliseconds)
    sample_rate: 16000                # Sample rate
    channels: 1                       # Number of channels
    pool_size: 10                     # Connection pool size
    acquire_timeout_ms: 3000          # Connection acquisition timeout (milliseconds)
  # TEN-VAD configuration
  ten_vad:
    hop_size: 512                     # Frame shift size
    threshold: 0.4                    # VAD detection threshold
    pool_size: 10                     # Resource pool size
    acquire_timeout_ms: 3000          # Acquisition timeout (milliseconds)

# Automatic Speech Recognition (ASR) configuration
asr:
  provider: "funasr"  # ASR provider: funasr / aliyun_funasr / doubao / aliyun_qwen3 / xunfei
  # FunASR configuration
  funasr:
    host: "127.0.0.1"          # FunASR server address
    port: "10096"              # FunASR server port
    mode: "offline"            # Recognition mode: offline/online
    sample_rate: 16000         # Sample rate
    chunk_size: [5, 10, 5]     # Chunk size configuration
    chunk_interval: 10         # Chunk interval (milliseconds)
    max_connections: 5         # Maximum connections
    timeout: 30                # Timeout (seconds)
    auto_end: true             # Whether to auto end
  # Aliyun FunASR config
  aliyun_funasr:
    api_key: ""
    ws_url: "wss://dashscope.aliyuncs.com/api-ws/v1/inference/"
    model: "fun-asr-realtime"
    format: "pcm"        # only pcm
    sample_rate: 16000     # only 16000
    vocabulary_id: ""
    disfluency_removal_enabled: false
    timeout: 30

  # Doubao ASR config
  doubao:
    appid: "xxx"                    # Application ID
    access_token: "xxx-Cu"          # Access token
    ws_url: "wss://openspeech.bytedance.com/api/v3/sauc/bigmodel_nostream"  # WebSocket URL
    model_name: "bigmodel"          # Model name
    end_window_size: 800            # End window size
    enable_punc: true               # Enable punctuation
    enable_itn: true                # Enable inverse text normalization
    enable_ddc: false               # Enable digital content detection correction
    timeout: 30                     # Timeout (seconds)

  # Xunfei ASR config
  xunfei:
    appid: ""                      # Xunfei AppID
    api_key: ""                    # Xunfei APIKey
    api_secret: ""                 # Xunfei APISecret
    host: "iat-api.xfyun.cn"       # WebSocket domain
    path: "/v2/iat"                # WebSocket path
    domain: "iat"                  # Business domain
    language: "zh_cn"              # Language
    accent: "mandarin"             # Accent
    sample_rate: 16000              # Sample rate
    timeout: 30                     # Timeout (seconds)

# Text to Speech (TTS) configuration
tts:
  provider: "doubao_ws"  # TTS provider: xiaozhi/doubao/doubao_ws/cosyvoice/edge/edge_offline/xunfei/xunfei_super_tts
  openai:  # OpenAI compatible format TTS service, here using Silicon Flow service
    api_key: "xxxx" # API key
    api_url: "https://api.siliconflow.cn/v1/audio/speech"
    model: "FunAudioLLM/CosyVoice2-0.5B"
    voice: "FunAudioLLM/CosyVoice2-0.5B:alex"
    response_format: "mp3"
    speed: 1.0
    stream: true
  # Doubao TTS config (HTTP method)
  doubao: # Basically deprecated, does not support streaming
    appid: "6886011847"                  # Application ID
    access_token: "access_token"         # Access token
    model: "seed-tts-1.1"                # Model
    voice: "BV001_streaming"             # Voice model
    api_url: "https://openspeech.bytedance.com/api/v3/tts/unidirectional"  # API URL
  # Doubao TTS config (WebSocket method), supports streaming output
  doubao_ws:
    appid: "6886011847"                         # Application ID
    access_token: "access_token"                # Access token
    model: "seed-tts-1.1"                       # Model
    resource_id: ""                             # Optional, recommended to fill in the instance ID from console, such as TTS-SeedTTS2.xxxxx
    voice: ""                                   # Voice model
    ws_url: "wss://openspeech.bytedance.com/api/v3/tts/unidirectional/stream"  # WebSocket URL
  # CosyVoice TTS config
  cosyvoice:
    api_url: "https://tts.linkerai.top/tts"  # API URL
    spk_id: "spk_id"                         # Speaker ID
    frame_duration: 60                       # Frame duration (milliseconds)
    target_sr: 24000                         # Target sample rate
    audio_format: "mp3"                      # Audio format
    instruct_text: "Hello"                     # Instruction text
  # Microsoft Edge TTS config
  edge:
    voice: "zh-CN-XiaoxiaoNeural"  # Voice model
    rate: "+0%"                    # Rate adjustment
    volume: "+0%"                  # Volume adjustment
    pitch: "+0Hz"                  # Pitch adjustment
    connect_timeout: 10            # Connection timeout (seconds)
    receive_timeout: 60            # Receive timeout (seconds)
  # Edge offline TTS config
  edge_offline:
    server_url: "ws://localhost:8080/tts"  # Server URL
    timeout: 30                            # Timeout (seconds)
    sample_rate: 16000                     # Sample rate
    channels: 1                            # Number of channels
    frame_duration: 20                     # Frame duration (milliseconds)
  # Xiaozhi TTS config
  xiaozhi:
    server_addr: "wss://api.tenclass.net/xiaozhi/v1/"  # Server address
    device_id: "ba:8f:17:de:94:94"                      # Device ID
    client_id: "e4b0c442-98fc-4e1b-8c3d-6a5b6a5b6a6d"  # Client ID
    token: "test-token"                                 # Access token
  # Xunfei online TTS config
  xunfei:
    app_id: ""
    api_key: ""
    api_secret: ""
    ws_url: "wss://tts-api.xfyun.cn/v2/tts"
    voice: "xiaoyan"
    audio_encoding: "raw"   # raw / opus
    sample_rate: 16000      # 8000 / 16000
    speed: 50               # 0-100
    volume: 50              # 0-100
    pitch: 50               # 0-100
    tte: "UTF8"
    reg: 0
    rdn: 0
    frame_duration: 60
    connect_timeout: 10
    read_timeout: 30
  # Xunfei super human-like TTS config
  xunfei_super_tts:
    app_id: ""
    api_key: ""
    api_secret: ""
    ws_url: "wss://cbm01.cn-huabei-1.xf-yun.com/v1/private/mcd9m97e6"
    voice: "x6_lingxiaoxue_pro"
    audio_encoding: "raw"   # raw / opus
    sample_rate: 24000      # 8000 / 16000 / 24000
    speed: 50
    volume: 50
    pitch: 50
    bgs: 0
    reg: 0
    rdn: 0
    rhy: 0
    oral_level: "mid"
    spark_assist: 1
    stop_split: 0
    remain: 0
    frame_duration: 60
    connect_timeout: 10
    read_timeout: 30

# Large Language Model (LLM) configuration
llm:
  provider: "qwen_72b"  # Default LLM provider to use
  # DeepSeek V3 model config (Silicon Flow platform)
  deepseek:
    type: "openai"                               # Interface type
    model_name: "Pro/deepseek-ai/DeepSeek-V3"    # Model name
    api_key: "api_key"                           # API key
    base_url: "https://api.siliconflow.cn/v1"    # API base URL
    max_tokens: 500                              # Maximum generated token count
  # DeepSeek V2.5 model config (Silicon Flow platform)
  deepseek2_5:
    type: "openai"                               # Interface type
    model_name: "deepseek-ai/DeepSeek-V2.5"      # Model name
    api_key: "api_key"                           # API key
    base_url: "https://api.siliconflow.cn/v1"    # API base URL
    max_tokens: 500                              # Maximum generated token count
  # Tongyi Qianwen 72B model config (Silicon Flow platform)
  qwen_72b:
    type: "openai"                               # Interface type
    model_name: "Qwen/Qwen2.5-72B-Instruct"     # Model name
    api_key: "api_key"                           # API key
    base_url: "https://api.siliconflow.cn/v1"    # API base URL
    max_tokens: 500                              # Maximum generated token count
  # ChatGLM model config (Zhipu AI)
  chatglmllm:
    type: "openai"                               # Interface type
    model_name: "glm-4-flash"                    # Model name
    base_url: "https://open.bigmodel.cn/api/paas/v4/"  # API base URL
    api_key: "api_key"                           # API key
    max_tokens: 500                              # Maximum generated token count
  # Aliyun Tongyi Qianwen config
  aliyun_qwen:
    type: "openai"                               # Interface type
    model_name: "qwen2.5-72b-instruct"          # Model name
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"  # API base URL
    api_key: "api_key"                           # API key
    max_token: 500                               # Maximum generated token count
  # Doubao DeepSeek model config
  doubao_deepseek:
    type: "openai"                               # Interface type
    model_name: "deepseek-v3"                    # Model name
    api_key: "api_key"                           # API key
    base_url: "https://ark.cn-beijing.volces.com/api/v3"  # API base URL
    max_tokens: 500                              # Maximum generated token count

# Vision recognition configuration
vision:
  enable_auth: false  # Whether to enable authentication
  vision_url: "http://192.168.208.214:8989/xiaozhi/api/vision"  # Vision API URL sent to device
  # Vision Language Model config
  vllm:
    provider: "aliyun_vision"  # Vision model provider
    # Aliyun vision model config
    aliyun_vision:
      type: "openai"                               # Interface type
      model_name: "qwen-vl-plus-latest"            # Model name
      base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"  # API base URL
      api_key: "api_key"                           # API key
      max_token: 500                               # Maximum generated token count
    # Doubao vision model config
    doubao_vision:
      type: "openai"                               # Interface type
      model_name: "doubao-1.5-vision-lite-250315" # Model name
      api_key: "api_key"                           # API key
      base_url: "https://ark.cn-beijing.volces.com/api/v3"  # API base URL
      max_tokens: 500                              # Maximum generated token count

# OTA (Over-The-Air) configuration
ota:
  signature_key: "your_ota_signature_key_here"  # OTA signature key
  # Test environment config, for internal testing
  test:
    websocket:
      url: "ws://192.168.208.214:8989/xiaozhi/v1/"  # WebSocket URL
    mqtt:
      enable: false                # When true, mqtt config will be sent to device
      endpoint: "192.168.208.214"  # MQTT endpoint, can include port
  # External environment config, for production
  external:
    websocket:
      url: "wss://www.tb263.cn:55555/go_ws/xiaozhi/v1/"  # WebSocket URL
    mqtt:
      enable: false                # When true, mqtt config will be sent to device
      endpoint: "www.youdomain.cn" # MQTT endpoint, can include port

# MCP (Model Control Protocol) configuration
mcp:
  # Global MCP server configuration
  global:
    enabled: true  # Whether to enable global MCP
    servers:
      # Filesystem MCP server
      - name: "filesystem"
        type: "sse"                           # Connection type: SSE
        url: "http://localhost:3001/sse"      # Server URL
        enabled: true                         # Whether to enable
      # Memory MCP server
      - name: "memory"
        type: "streamablehttp"                # Connection type: Streaming HTTP
        url: "http://localhost:3002/mcp"      # Server URL
        enabled: true                         # Whether to enable
    reconnect_interval: 300      # Reconnect interval (seconds)
    max_reconnect_attempts: 10   # Maximum reconnect attempts

# Local MCP tool configuration
local_mcp:
  exit_conversation: true           # Allow exit conversation
  clear_conversation_history: true  # Allow clear conversation history

# Memory long-term memory configuration
memory:
  provider: "nomemo"  # Memory provider: nomemo (no long-term memory), llm (short-term conversation memory, based on Redis), or memobase (long-term memory)
  # LLM Memory config (short-term conversation memory)
  # Uses Redis storage, see redis config above
  nomemo:
    # No additional config needed, uses global redis config
  # Memobase config (long-term memory storage)
  memobase:
    base_url: "https://api.memobase.dev"              # Memobase project URL
    api_key: "your_memobase_api_key_here"             # Memobase API key
    api_version: "v1"                                 # API version
    enable_search: true         # Allow searching memory before calling llm, adds ~200ms latency
    search_threshold: 0.5       # Search threshold, 0.5 means only memories with similarity > 0.5 will be added to llm input
    search_top_k: 3             # Search TopK, top K memories with highest similarity will be added to llm input
  mem0:
    api_key: "your_mem0_api_key_here"
    base_url: "https://api.mem0.ai"
    enable_search: true         # Allow searching memory before calling llm, adds ~200ms latency
    search_threshold: 0.5       # Search threshold, 0.5 means only memories with similarity > 0.5 will be added to llm input
    search_top_k: 3             # Search TopK, top K memories with highest similarity will be added to llm input

# Enable greeting
enable_greeting: true

# Greeting list (randomly selected)
greeting_list:
  - "Hello, I'm Xiaozhi, nice to meet you."
  - "Hello, I'm Xiaozhi, what's fun today."
  - "Hello, I'm Xiaozhi, what can I help you with."

# Wake-up word list
wakeup_words:
  - "Xiaozhi"
  - "Xiaozhi"
  - "Hello Xiaozhi"

voice_identify:
  enable: true
  base_url: "http://192.168.208.214:8080"
  threshold: 0.4  # Voiceprint recognition threshold, range 0.0-1.0, default 0.6