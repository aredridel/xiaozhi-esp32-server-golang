version: '3.8'

services:
  # MySQL database service
  mysql:
    image: mysql:8.0
    container_name: xiaozhi-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: xiaozhi_admin
    ports:
      - "23306:3306"        # Optional: mapping not required
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --skip-ssl
    networks:
      - xiaozhi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysql", "-h", "localhost", "-P", "3306", "-u", "root", "-ppassword", "-e", "SELECT 1"]
      timeout: 5s
      retries: 3
      interval: 10s
      start_period: 180s

  # Main program service (local build version)
  main-server:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.main
      platform: linux/amd64
      args:
        TARGETARCH: amd64
    container_name: xiaozhi-main-server
    command: ["/workspace/bin/xiaozhi_server", "-c", "/workspace/config/config.personal.yaml"]
    ports:
      - "8989:8989"        # WebSocket service port (maps to host 18989)
      - "2883:2883"        # MQTT server port (maps to host 12883)
      - "8888:8888/udp"     # UDP server port 8888
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_NAME=xiaozhi_admin
      - BACKEND_URL=http://backend:8080
    volumes:
      - ../../config:/workspace/config
      - ../../logs:/workspace/logs
    networks:
      - xiaozhi-network
    restart: unless-stopped

  # Backend management service (local build version)
  backend:
    build:
      context: ../../manager/backend
      dockerfile: Dockerfile
    container_name: xiaozhi-backend
    ports:
      - "8081:8080"        # Backend management service port (maps to host 28080)
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_NAME=xiaozhi_admin
    volumes:
      - ../../manager/backend/config:/root/config
    networks:
      - xiaozhi-network
    restart: unless-stopped

  # Frontend management service (local build version)
  frontend:
    build:
      context: ../../manager/frontend
      dockerfile: Dockerfile
    container_name: xiaozhi-frontend
    ports:
      - "8080:80"           # Frontend management service port (maps to host 18080)
    depends_on:
      - backend
    networks:
      - xiaozhi-network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  xiaozhi-network:
    driver: bridge