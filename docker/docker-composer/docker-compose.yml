version: '3.8'

services:
  # MySQL database service
  mysql:
    image: mysql:8.0
    container_name: xiaozhi-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: xiaozhi_admin
    ports:
      - "23306:3306"        # Optional: mapping not required
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --skip-ssl
    networks:
      - xiaozhi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysql", "-h", "localhost", "-P", "3306", "-u", "root", "-ppassword", "-e", "SELECT 1"]
      timeout: 5s
      retries: 3
      interval: 10s
      start_period: 180s

  # Main program service
  main-server:
    image: ghcr.io/hackers365/xiaozhi_server:0.5.6
    container_name: xiaozhi-main-server
    command: ["/workspace/bin/xiaozhi_server", "-c", "/workspace/config/config.yaml"]
    ports:
      - "8989:8989"        # WebSocket service port (maps to host 18989)
      - "2883:2883"        # MQTT server port (maps to host 12883)
      - "8888:8888/udp"     # UDP server port 8888
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_NAME=xiaozhi_admin
      - BACKEND_URL=http://backend:8080
    volumes:
      - ../../config:/workspace/config
      - ../../logs:/workspace/logs
    networks:
      - xiaozhi-network
    restart: unless-stopped

  # Backend management service
  backend:
    image: ghcr.io/hackers365/xiaozhi_manager_backend:0.5.6
    container_name: xiaozhi-backend
    ports:
      - "8081:8080"        # Backend management service port (maps to host 28080)
    depends_on:
      mysql:
        condition: service_healthy
      voice-server:
        condition: service_started
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_NAME=xiaozhi_admin
      - AUDIO_BASE_PATH=/data/chat_history/audio
      - SPEAKER_SERVICE_URL=http://voice-server:8080
    volumes:
      - ../../manager/backend/config:/root/config
      - backend_audio_data:/data/chat_history/audio
    networks:
      - xiaozhi-network
    restart: unless-stopped

  # Frontend management service
  frontend:
    image: ghcr.io/hackers365/xiaozhi_manager_frontend:0.5.6
    container_name: xiaozhi-frontend
    ports:
      - "8080:80"           # Frontend management service port (maps to host 18080)
    depends_on:
      - backend
    networks:
      - xiaozhi-network
    restart: unless-stopped

  # Qdrant vector database service (for speaker recognition)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: xiaozhi-qdrant
    ports:
      - "6333:6333"         # REST API port
      - "6334:6334"         # gRPC port
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - xiaozhi-network
    restart: unless-stopped

  # ASR voice recognition service (speaker recognition)
  voice-server:
    image: ghcr.io/hackers365/voice_server:0.1.0    # Replace with actual image name
    container_name: xiaozhi-voice-server
    ports:
      - "8082:8080"         # ASR service port (maps to host 8082)
    depends_on:
      - qdrant
    environment:
      - VAD_ASR_SPEAKER_ENABLED=true
      - VAD_ASR_SPEAKER_VECTOR_DB_HOST=qdrant
      - VAD_ASR_SPEAKER_VECTOR_DB_PORT=6334
      - VAD_ASR_SPEAKER_VECTOR_DB_COLLECTION_NAME=speaker_embeddings
      - VAD_ASR_SPEAKER_THRESHOLD=0.6
      - VAD_ASR_LOGGING_LEVEL=info
    volumes:
      - asr_data:/app/data
    networks:
      - xiaozhi-network
    restart: unless-stopped

volumes:
  mysql_data:
  backend_audio_data:
  qdrant_data:
  asr_data:

networks:
  xiaozhi-network:
    driver: bridge
